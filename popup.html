<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        /* Light Theme Variables */
        --bg-color: #f7f8fa;
        --text-color: #222222;
        --text-muted: #666666;
        --card-bg: #ffffff;
        --border-color: #dddddd;
        --hover-bg: #f0f0f0;

        --item-unsolved: #ffffff;
        --item-solved: #e8f5e9;
        --item-solved-border: #c8e6c9;

        --current-bg: #4caf50;
        --current-text: #ffffff;

        --btn-bg: #eeeeee;
        --btn-hover: #dddddd;

        --easy-bg: #c8e6c9;
        --easy-text: #2e7d32;
        --med-bg: #fff3cd;
        --med-text: #856404;
        --hard-bg: #ffcdd2;
        --hard-text: #c62828;
      }

      [data-theme="dark"] {
        /* Dark Theme Variables */
        --bg-color: #18181b;
        --text-color: #e4e4e7;
        --text-muted: #a1a1aa;
        --card-bg: #27272a;
        --border-color: #3f3f46;
        --hover-bg: #3f3f46;

        --item-unsolved: #27272a;
        --item-solved: #14532d;
        --item-solved-border: #166534;

        --current-bg: #3b82f6;
        --current-text: #ffffff;

        --btn-bg: #3f3f46;
        --btn-hover: #52525b;

        --easy-bg: #064e3b;
        --easy-text: #6ee7b7;
        --med-bg: #78350f;
        --med-text: #fcd34d;
        --hard-bg: #7f1d1d;
        --hard-text: #fca5a5;
      }

      body {
        width: 360px;
        height: 520px;
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 12px;
        box-sizing: border-box;
        gap: 12px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      /* Theme Toggle Button */
      #themeToggle {
        background: transparent;
        border: none;
        color: var(--text-color);
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #themeToggle:hover {
        background: var(--hover-bg);
      }
      #themeToggle svg {
        width: 18px;
        height: 18px;
      }
      [data-theme="dark"] .icon-moon {
        display: none;
      }
      [data-theme="light"] .icon-sun {
        display: none;
      }

      .card {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
      }

      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        font-size: 12px;
        outline: none;
      }
      select:last-child {
        margin-bottom: 0;
      }

      #progress-container {
        height: 8px;
        background: var(--border-color);
        border-radius: 6px;
        overflow: hidden;
      }

      #progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4caf50, #66bb6a);
        width: 0%;
        transition: width 0.4s ease-out;
      }

      #progress-text {
        font-size: 11px;
        margin-top: 6px;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* Scrollable list container */
      #problem-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
      }
      /* Custom Scrollbar */
      #problem-list::-webkit-scrollbar {
        width: 6px;
      }
      #problem-list::-webkit-scrollbar-track {
        background: transparent;
      }
      #problem-list::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      .item {
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.1s,
          border 0.15s;
        border: 1px solid transparent;
      }

      .item:hover:not(.current) {
        border-color: var(--border-color);
        background: var(--hover-bg);
      }
      .item:active {
        transform: scale(0.98);
      }

      .current {
        background: var(--current-bg);
        color: var(--current-text);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .solved {
        background: var(--item-solved);
        border-color: var(--item-solved-border);
      }

      .unsolved {
        background: var(--item-unsolved);
        border-color: var(--border-color);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .title {
        font-size: 12px;
        flex: 1;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .badge {
        font-size: 10px;
        padding: 4px 6px;
        border-radius: 6px;
        font-weight: 600;
        flex-shrink: 0; /* Prevents squishing */
      }

      .btn {
        border: none;
        background: var(--btn-bg);
        color: var(--text-color);
        border-radius: 6px;
        padding: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0; /* Prevents button disappearing */
        transition: background 0.2s;
      }

      .btn:hover {
        background: var(--btn-hover);
      }

      .current .btn {
        background: rgba(255, 255, 255, 0.25);
        color: white;
      }
      .current .btn:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      .current .badge {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h3>Striver Tracker</h3>
        <button id="themeToggle" title="Toggle Theme">
          <svg
            class="icon-sun"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            ></path>
          </svg>
          <svg
            class="icon-moon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            ></path>
          </svg>
        </button>
      </div>

      <div class="card">
        <select id="topicFilter">
          <option value="All">All Topics</option>
        </select>
        <select id="difficultyFilter">
          <option value="All">All Difficulties</option>
        </select>
        <select id="subtopicFilter">
          <option value="All">All Subtopics</option>
        </select>
      </div>

      <div class="card">
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>
        <div id="progress-text"></div>
      </div>

      <div id="problem-list"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
